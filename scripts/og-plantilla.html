<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Tarjeta para compartir</title>
<!-- Plantilla de las imágenes para compartir (1200 × 630). La usa scripts/og.js; no es una página de la web. -->
<style>
@font-face{font-family:"Shantell Sans";src:url("/assets/fonts/shantell-sans-800-latin.woff2") format("woff2");font-weight:800}
:root{--ink:#161616;--c:#ffe45c}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{width:1200px;height:630px;overflow:hidden;background:#fff;color:var(--ink)}
body{padding:34px;font-family:system-ui,"Segoe UI",sans-serif}
.hoja{position:relative;height:100%;border:6px solid var(--ink);border-radius:255px 18px 225px 18px/18px 225px 18px 255px;padding:44px 56px 40px;display:flex;flex-direction:column}
.cab{display:flex;align-items:center;gap:18px}
.llave{width:34px;height:84px;flex:none}
.marca{font:800 40px/1 "Shantell Sans";letter-spacing:-.01em}
.lema{display:block;font:800 22px/1.2 "Shantell Sans";margin-top:6px}
.lema b{background:var(--ink);color:#ffe45c;padding:0 5px;border-radius:4px}
.tema{margin-left:auto;font:800 24px/1 "Shantell Sans";padding:12px 20px;border:5px solid var(--ink);background:var(--c);border-radius:14px 225px 14px 255px/255px 14px 225px 14px;transform:rotate(2deg)}
.titulo{flex:1 1 0;min-height:0;overflow:hidden;display:flex;align-items:center;padding:20px 140px 10px 0}
h1{font:800 64px/1.18 "Shantell Sans";letter-spacing:-.01em;text-wrap:balance}
h1 span{background:linear-gradient(transparent 4%,var(--c) 4% 54%,transparent 54%) .14em 0/100% 100% no-repeat,linear-gradient(transparent 44%,var(--c) 44% 97%,transparent 97%) 0 0/100% 100% no-repeat;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .08em}
.pie{display:flex;justify-content:space-between;align-items:flex-end;font-size:26px;font-weight:600}
.pie .url{font:800 28px/1 "Shantell Sans"}
.diez{position:absolute;right:46px;top:50%;width:132px;height:132px;margin-top:-50px;border:6px solid var(--ink);border-radius:50% 46% 52% 44%/48% 52% 46% 50%;background:var(--c);display:grid;place-items:center;font:800 70px/1 "Shantell Sans";transform:rotate(-8deg)}
</style>
</head>
<body>
<div class="hoja">
  <div class="cab">
    <svg class="llave" viewBox="0 0 40 100" aria-hidden="true"><path d="M6 5.5C14 3.6 27 3.4 34.6 5.2c1.6 9.4 1.5 22.6.2 31.6C26 38.6 13.6 38.4 5.3 36.9 3.9 27 4.2 15 6 5.5z" fill="#ffe45c" stroke="#161616" stroke-width="3" stroke-linejoin="round"/><path d="M13 31V17.5L27 31V17.5M12.5 12.4c2.3-2.6 4.6-2.6 7 0s4.7 2.6 7.5-.2" fill="none" stroke="#161616" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 38.5V95M20 70h9.5v6M20 83h7" fill="none" stroke="#161616" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><div class="marca">Diez Claves</div><div class="lema">Recetas con <b>ñ</b></div></div>
    <div class="tema" id="tema" hidden></div>
  </div>
  <div class="titulo"><h1><span id="titulo"></span></h1></div>
  <div class="pie"><span id="pie">Seguridad digital en español</span><span class="url">diezclaves.com</span></div>
  <div class="diez" id="diez" hidden>10</div>
</div>
<script>
  const p = new URLSearchParams(location.search);
  document.documentElement.style.setProperty("--c", p.get("c") || "#ffe45c");
  document.getElementById("titulo").textContent = p.get("t") || "Seguridad digital en español, para cualquier persona";
  if (p.get("tema")) { const e = document.getElementById("tema"); e.textContent = p.get("tema"); e.hidden = false; }
  if (p.get("pie")) document.getElementById("pie").textContent = p.get("pie");
  if (p.get("diez")) document.getElementById("diez").hidden = false;
  else document.querySelector(".titulo").style.paddingRight = "0";
  // el título se encoge hasta caber en su caja
  document.fonts.ready.then(() => {
    const h = document.querySelector("h1"), caja = document.querySelector(".titulo");
    let s = parseFloat(p.get("tam") || 64);
    h.style.fontSize = s + "px";
    while ((h.scrollHeight > caja.clientHeight - 20 || h.scrollWidth > caja.clientWidth) && s > 30) { s -= 2; h.style.fontSize = s + "px"; }
    document.body.dataset.listo = "1";
  });
</script>
</body>
</html>
